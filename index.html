<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compo.io</title>
<meta name="description" content="Retrouve les titulaires des grandes finales de football et de rugby. Deux compos par jour, une par sport.">
<!-- Ajout à l'écran d'accueil : icône, nom court, et ouverture en plein écran
     sans la barre d'adresse du navigateur. -->
<link rel="icon" type="image/png" sizes="32x32" href="icone-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icone-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#13241A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Compo.io">
<!-- La vignette affichée quand on colle le lien dans une messagerie. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Compo.io">
<meta property="og:title" content="Compo.io">
<meta property="og:description" content="Peux-tu refaire la compo ? Les titulaires des grandes finales de foot et de rugby, deux par jour.">
<!-- Absolue, et non relative : la plupart des robots de messagerie ignorent un
     chemin relatif. Donc à changer si le site déménage. -->
<meta property="og:url" content="https://muksnuggets.github.io/Compo.io/">
<meta property="og:image" content="https://muksnuggets.github.io/Compo.io/partage.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="fr_FR">
<meta name="twitter:card" content="summary_large_image">
<style>
/* Polices servies par le site lui-meme, plus par Google : une requete de moins,
   aucun tiers, et surtout ce qui est teste est exactement ce qui est livre.
   Barlow est sous licence SIL OFL 1.1, voir polices/OFL.txt. 110 Ko en tout. */
@font-face{font-family:Barlow;font-style:normal;font-weight:400;font-display:swap;
  src:url(polices/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Barlow;font-style:normal;font-weight:600;font-display:swap;
  src:url(polices/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Barlow;font-style:normal;font-weight:700;font-display:swap;
  src:url(polices/barlow-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:700;font-display:swap;
  src:url(polices/barlow-condensed-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:800;font-display:swap;
  src:url(polices/barlow-condensed-latin-800-normal.woff2) format("woff2")}

:root{
  --bg:#E8EDE5; --surface:#F6F8F4; --ink:#13241A; --muted:#5A6B5E; --line:#C7D2C3;
  --pitch:#2E7D4F; --stripe:#33895A; --chalk:rgba(255,255,255,.82);
  --accent:#F2B705; --accent-ink:#1A1400; --miss:#C93C3C; --ok:#1F8A4C;
  --panel:#13241A; --panel-ink:#E8EDE5;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1712; --surface:#15221A; --ink:#E4ECE5; --muted:#8EA093; --line:#26392C;
    --pitch:#1D5A37; --stripe:#21633D; --chalk:rgba(255,255,255,.7);
    --accent:#F2B705; --accent-ink:#1A1400; --miss:#E06060; --ok:#3FBF74;
    --panel:#22382A; --panel-ink:#E4ECE5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1712; --surface:#15221A; --ink:#E4ECE5; --muted:#8EA093; --line:#26392C;
  --pitch:#1D5A37; --stripe:#21633D; --chalk:rgba(255,255,255,.7);
  --accent:#F2B705; --accent-ink:#1A1400; --miss:#E06060; --ok:#3FBF74;
  --panel:#22382A; --panel-ink:#E4ECE5;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
/* Le fond est aussi sur html : pendant une partie body est fixe et ne couvre
   que la zone visible, donc tout ce qui depasse laissait voir du blanc. */
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Barlow,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:600px;margin:0 auto;padding:20px 16px 48px}
.cond{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Home */
.brand{display:flex;align-items:baseline;gap:10px;margin:8px 0 4px}
.brand h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:clamp(56px,14vw,88px);line-height:.9;margin:0;letter-spacing:-.01em}
.brand .dot{color:var(--pitch)}
.lede{color:var(--muted);margin:0 0 20px;max-width:46ch}
.best.full{color:var(--ok)}
.sport{font-size:13px;color:var(--muted)}

/* Play */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.top.bas{margin:18px 0 0}
.back{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-weight:600}
.title{margin:0 0 2px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:28px;line-height:1.1}
.sub{color:var(--muted);margin:0 0 10px;font-size:15px}
.barre{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.clock,.count{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:26px;line-height:1;padding:7px 11px;border-radius:9px;background:var(--panel);color:var(--accent);font-variant-numeric:tabular-nums}
.count{color:var(--panel-ink)}
.clock.low{color:#FF6B6B}
.inp{display:block;width:100%;margin-top:10px;font:600 18px Barlow,sans-serif;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.inp[hidden]{display:none}        /* sinon le display:block l'emporte */
.inp:focus{outline:none;border-color:var(--accent)}
.inp.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.flash{min-height:22px;font-size:14px;color:var(--muted);margin:8px 0 0}
/* Aide a l'orthographe. Les noms viennent de toute la base, jamais de la compo
   du jour : la liste ne dit donc pas qui joue. Elle se glisse juste au-dessus
   de la saisie, a portee de pouce, et prend la place de la ligne de retour. */
.sugg{display:flex;gap:6px;margin:8px 0 0;overflow-x:auto;scrollbar-width:none;
  -webkit-overflow-scrolling:touch}
.sugg::-webkit-scrollbar{display:none}
.sugg button{flex:0 0 auto;font:600 14px/1 Barlow,sans-serif;white-space:nowrap;
  background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 13px}
.sugg button:active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.flash[hidden],.sugg[hidden]{display:none}
/* Pendant une partie, la PAGE est verrouillee et le panneau de jeu tient dans
   ce qui reste visible. Sur iOS le clavier ne retrecit pas la page, il la
   recouvre, et Safari fait defiler pour amener la saisie au-dessus du clavier —
   ce qui emportait le terrain hors de l'ecran.
   Le verrou porte sur body, pas sur le panneau : body fixe, le document n'a
   plus rien a faire defiler, donc Safari ne peut plus rien emporter. Un panneau
   en position:fixed, lui, se retrouvait mal place des que Safari avait deja
   decale la vue : on perdait le haut du terrain.
   Le panneau, en revanche, defile a l'interieur. Si la place manque vraiment on
   peut remonter voir le haut du terrain, et c'est le panneau qui bouge, pas la
   page.
   body fait exactement la zone visible — pas toute la fenetre. Avec inset:0 il
   faisait la hauteur SANS clavier : des que Safari decalait la vue, on tombait
   sur le vide en dessous, d'ou l'ecran blanc. --vue et --haut viennent de
   visualViewport, seule API qui sache ce qui reste visible sous le clavier et
   de combien la vue a ete decalee. */
body.enjeu{position:fixed;left:0;right:0;width:100%;overflow:hidden;
  top:var(--haut,0px);height:var(--vue,100dvh)}
body.enjeu .wrap{padding:0;height:100%}
#play.enjeu{height:100%;overflow:hidden;
  display:flex;flex-direction:column;
  /* body fixe sort du flux, donc le padding de :root qui reserve l'encoche ne
     s'applique plus : le titre passait sous la barre d'etat. On le reprend ici. */
  padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(10px + env(safe-area-inset-bottom,0px))}
#play.enjeu > *{flex:0 0 auto}
/* Le terrain se serre pour tenir ; s'il ne peut plus, c'est cette zone-la qui
   glisse, et elle seule. La saisie reste dessous. */
#play.enjeu > .scene{flex:1 1 auto;min-height:0;
  display:flex;flex-direction:column;
  overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#play.enjeu .scene > .pitch{flex:1 1 auto;min-height:150px}
/* Quand il ne reste presque rien, on enleve ce qui n'aide pas a jouer. Les
   etiquettes partent aussi : onze noms ne tiennent pas dans 270 px sans se
   chevaucher. Le maillot allume suffit a voir la compo se remplir, et le nom
   trouve s'affiche sous la saisie. */
/* Quand le clavier mange l'ecran on sacrifie le sous-titre, la barre d'onglets
   et les etiquettes — mais jamais « Abandonner » : c'est la sortie, et un
   joueur sans sortie est un joueur coince. */
/* Clavier ouvert : rien que le terrain et la saisie. Indice, Abandonner et
   Retour reviennent des qu'on le referme — une tape sur le terrain suffit.
   C'est la hauteur perdue qui fait foi, pas le focus : sur iOS le focus pose
   au demarrage n'ouvre aucun clavier. */
#play.enjeu.clavier #acts,#play.enjeu.clavier .top.bas{display:none}
#play.enjeu.court .sub,#play.enjeu.court .top.bas{display:none}
#play.enjeu.court #acts{margin:4px 0 0}
#play.enjeu.court #acts .btn{padding:7px 12px;font-size:13px}
#play.enjeu.court .title{font-size:21px}
#play.enjeu.court .pl .nm{display:none}
#play.enjeu.court .pl.todo svg{opacity:.4}
#play.enjeu.court .pl.miss svg{opacity:.4;filter:grayscale(1)}
.pitch{position:relative;width:100%;border-radius:10px;overflow:hidden;
  background:repeating-linear-gradient(to bottom,var(--pitch) 0 8%,var(--stripe) 8% 16%)}
/* Les joueurs n'occupent que la bande 18–90 (foot) et 18–82 (rugby) de la
   hauteur. On raccourcit donc le terrain : le vide se reduit d'autant, et les
   traits, dessines sans contrainte de proportion, suivent. */
.pitch.foot{aspect-ratio:68/78}
/* Une rangee de moins depuis que le 9 et le 10 sont cote a cote : le terrain
   peut se raccourcir sans serrer les joueurs. */
.pitch.rugby{aspect-ratio:70/79}
.pitch svg.lines{position:absolute;inset:0;width:100%;height:100%}
/* 19 % : les deux joueurs les plus proches sont a 20 % l'un de l'autre, donc
   les etiquettes ne peuvent jamais se toucher, quelle que soit la largeur. */
.pl{position:absolute;transform:translate(-50%,-30%);display:flex;flex-direction:column;align-items:center;width:19%;pointer-events:none}
.pl svg{width:36px;height:34px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.pl .nm{margin-top:3px;font:600 13px/1.15 Barlow,sans-serif;text-align:center;color:#fff;background:rgba(0,0,0,.42);padding:2px 5px;border-radius:4px;min-width:28px;max-width:100%}
/* Les cases vides doivent se lire : on voit ainsi d'un coup d'oeil ce qui
   reste a trouver, sans qu'elles concurrencent les noms deja places. */
.pl.todo .nm{color:rgba(255,255,255,.85);background:rgba(0,0,0,.55)}
.pl.hit .nm{background:#fff;color:#13241A;animation:pop .35s}
.pl.miss .nm{background:var(--miss);color:#fff}
.daily{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 18px;
  background:var(--surface);display:flex;flex-direction:column;gap:9px}
.daily .tag{font:700 11px/1 Barlow,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);padding:5px 9px;border-radius:999px}
.daily .what{min-width:0;font-weight:700;font-size:19px;line-height:1.2}
/* Les affiches les plus longues font 308 px : on descend d'un cran plutot que
   de les laisser se couper en deux sur un petit ecran. */
@media (max-width:400px){.daily .what{font-size:17.5px}}
@media (max-width:340px){.daily .what{font-size:16px}}
.daily .what small{display:block;font-weight:400;font-size:13.5px;color:var(--muted);margin-top:4px}
/* Le sport, en tout petit au-dessus de l'affiche : il situe la carte sans
   prendre la vedette. */
/* Pastille deux tons aux couleurs du club, et drapeau pour les nations. */
/* Un rond plein, peint aux couleurs : le drapeau pour une nation, les deux
   couleurs du club sinon. Rien d'autre dedans — ni emoji, ni image. */
.rond{width:22px;height:22px;flex:0 0 22px;border-radius:50%;display:inline-block;
  border:1px solid rgba(0,0,0,.18);vertical-align:-1px}
.quel{font:700 10.5px/1 Barlow,sans-serif;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
/* Ce qu'il y a a faire, dit une seule fois et en clair. */
.task{font-size:14px;color:var(--muted)}
.task b{color:var(--ink)}
/* La pastille ne doit jamais se detacher du nom qu'elle designe. */
.eq{white-space:nowrap}
.daily .pts{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:30px;line-height:1}
.daily .streak{font-weight:600;font-size:14px;color:var(--muted)}
.daily .ident{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%}
.daily input{flex:1;min-width:150px;font:inherit;font-size:16px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:inherit}
.note{width:100%;font-size:13px;color:var(--muted);margin:-6px 0 18px}
.note b{color:inherit}
.note a{color:var(--ink);text-underline-offset:2px}
.board{margin:14px 0 0;width:100%;border-collapse:collapse;font-size:14px}
.board th,.board td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line)}
.board th{font:700 11px/1 Barlow,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.board td.n{text-align:right;font-variant-numeric:tabular-nums}
.board tr.moi td{background:var(--accent);color:var(--accent-ink)}
.bench{flex:1;min-width:0;display:flex;justify-content:center}
/* La pastille est hors du terrain, donc sur le fond clair de la page : ses
   couleurs sont celles de la page, pas celles de la pelouse. */
.coach{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 6px}
.coach .badge{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 11px/1 Barlow,sans-serif;background:var(--ink);color:var(--bg)}
.coach .role{font:600 10px/1 Barlow,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.coach .nm{font:600 13px/1.15 Barlow,sans-serif;color:var(--ink);padding:2px 6px;border-radius:4px}
/* Une fois le nom la, le mot ENTRAINEUR ne sert plus : il lui cede la place,
   sinon le nom passe sur deux lignes et la barre grandit. */
.coach.hit .role,.coach.miss .role{display:none}
.coach .nm{white-space:nowrap}
.coach.todo .nm{color:var(--muted)}
.coach.hit .nm{background:var(--ink);color:var(--bg);animation:pop .35s}
.coach.miss .nm{background:var(--miss);color:#fff}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
/* Deux boutons suffisent a la fin d'une partie : partager, et revenir. Rejouer
   et changer d'equipe sont des envies rares, elles passent en liens. */
.apres{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0 0;font-size:14px}
.apres a{color:var(--muted);text-underline-offset:2px}
.apres a:hover{color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.result{margin-top:14px;padding:16px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.result .big{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:44px;line-height:1}
.hidden{display:none!important}
/* Sur un ecran de 320 px, les etiquettes de la premiere ligne de melee se
   chevauchaient de 16 px. A cette taille elles sont plus petites : plus un
   seul chevauchement, mesure sur foot et rugby. */
@media (max-width:420px){
  .pl .nm{font-size:12px}.pl svg{width:28px;height:27px}
  .clock,.count{font-size:23px;padding:7px 9px}
}
/* Apres le bloc 420, sinon c'est lui qui gagnerait : a egalite de poids,
   la derniere regle ecrite l'emporte. */
@media (max-width:360px){
  .pl .nm{font-size:11px;padding:2px 4px}.pl svg{width:23px;height:22px}
}
/* Le profil se range derriere un portrait, en haut a droite : il n'a pas
   besoin d'un onglet a lui, on y va rarement. */
.brand{justify-content:space-between}
.portrait{width:44px;height:44px;flex:0 0 auto;border-radius:50%;border:1px solid var(--line);
  background:var(--ink);color:var(--bg);font:700 17px/1 Barlow,sans-serif;align-self:center}
.portrait:hover{border-color:var(--ink)}

/* Apercu du terrain sur la carte du jour : la forme de la compo se devine,
   les noms restent caches. */
.carte{display:flex;gap:14px;align-items:center}
.mini{flex:0 0 96px;border-radius:8px;position:relative;overflow:hidden;
  background:repeating-linear-gradient(to bottom,var(--pitch) 0 8%,var(--stripe) 8% 16%)}
.mini.foot{aspect-ratio:68/78}
.mini.rugby{aspect-ratio:70/79}
.mini i{position:absolute;transform:translate(-50%,-50%);width:12px;height:12px;border-radius:50%;
  background:rgba(0,0,0,.45);color:rgba(255,255,255,.9);font:700 8.5px/12px Barlow,sans-serif;
  text-align:center;font-style:normal}
.carte .droite{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
/* Le bloc de texte garde un min-width herite de l'ancienne carte : dans une
   colonne il forcait sa largeur et faisait deborder les boutons a 320 px. */
.carte .what{min-width:0}
.duo{display:flex;gap:8px;flex-wrap:wrap}
.classement{width:100%}
.classement .board{margin-top:10px;table-layout:fixed}
.classement .board td:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* A 320 px les cinq colonnes debordaient de la carte : on resserre plutot
   que de retirer une colonne, toutes disent quelque chose. */
@media (max-width:380px){.classement .board{font-size:13px}
  .classement .board th,.classement .board td{padding:6px 4px}}
@media (max-width:360px){.mini{flex-basis:80px}.mini i{width:10px;height:10px;font-size:7.5px;line-height:10px}}

/* Fiches du profil et des jours d'avant */
.bloc{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px 16px;margin:0 0 14px}
.bloc h3{font:700 11px/1 Barlow,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.bloc p{margin:0 0 10px;font-size:14.5px}
.bloc .ligne{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bloc input{flex:1;min-width:150px;font:inherit;font-size:16px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:inherit}
.code{font:600 13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;
  background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin:0 0 10px}
.chiffres{display:flex;gap:18px;flex-wrap:wrap}
.chiffre b{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:30px;line-height:1}
.chiffre span{font-size:12.5px;color:var(--muted)}
.jour{width:100%;display:flex;align-items:center;gap:10px;text-align:left;color:inherit;font:inherit;
  background:none;border:0;border-bottom:1px solid var(--line);padding:11px 2px}
.jour:hover .quoi{color:var(--pitch)}
.jour .n{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:19px;color:var(--muted);min-width:34px}
.jour .quoi{flex:1;min-width:0;font-weight:600;font-size:15px;line-height:1.25}
.jour .quoi small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.jour .res{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:17px;color:var(--muted)}
.jour .res.full{color:var(--ok)}

/* Deux onglets, en haut, sans barre fixe : la place en bas sert au jeu. */
/* La marge du haut est a nous : le titre a une interligne de .9, donc ses
   jambages depassent de sa boite et venaient se poser sur les onglets des que
   l'accroche a cesse de faire tampon. */
.onglets{display:flex;gap:6px;margin:16px 0 18px}
.onglets button{flex:1;border:1px solid var(--line);background:none;border-radius:999px;
  padding:9px 10px;font:600 14.5px Barlow,sans-serif;color:var(--muted)}
.onglets button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* Toutes les finales : sport, puis competition, puis les annees. */
.sports{display:flex;gap:6px;margin:0 0 16px}
.sports button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;
  padding:10px;font:700 15px Barlow,sans-serif}
.sports button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.comp{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin:0 0 12px;overflow:hidden}
/* Deuxieme rangee : la competition. Plus discrete que le sport, pour que la
   hierarchie se lise — le sport commande, la competition precise. */
.comps{display:flex;gap:6px;margin:0 0 14px}
.comps button{flex:1;border:1px solid var(--line);background:none;border-radius:999px;
  padding:8px 6px;font:600 14px Barlow,sans-serif;color:var(--muted);white-space:nowrap}
.comps button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.combien{margin:0 0 10px;font-size:13px;color:var(--muted)}
.comp .dedans{padding:2px 16px 6px}
/* Une finale : l'annee a gauche, l'affiche a droite. Rien d'autre — c'est une
   liste qu'on parcourt, pas une fiche qu'on lit. */
/* Une finale se lit comme un tableau d'affichage : l'annee, puis les deux
   camps de part et d'autre du score. Les sigles et les ronds pesent le meme
   espace a gauche et a droite, donc le score reste au milieu. */
.fin{width:100%;display:flex;align-items:center;gap:10px;text-align:left;color:inherit;font:inherit;
  background:none;border:0;border-top:1px solid var(--line);padding:10px 2px}
.comp .dedans .fin:first-child{border-top:0}
.fin .an{flex:0 0 40px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:19px;
  color:var(--muted);line-height:1.05}
.fin .an em{display:block;font:400 10px/1.2 Barlow,sans-serif;font-style:normal}
.fin.fait .an{color:var(--ok)}
.duel{flex:1;min-width:0;display:flex;align-items:center;gap:7px}
/* Les deux camps se serrent contre le score. */
.cote{flex:1;min-width:0;display:flex;align-items:center;gap:6px;justify-content:flex-end}
.cote.droite{justify-content:flex-start}
.cote b{font:700 15px/1 Barlow,sans-serif;min-width:0}
/* Largeur fixe pour le sigle : c'est ce qui met tous les drapeaux sur la
   meme colonne, d'une ligne a l'autre. */
.cote b.sig{flex:0 0 40px;text-align:right}
.cote.droite b.sig{text-align:left}
/* Les noms de clubs sont plus longs que des sigles : ils descendent d'un
   cran, et encore d'un sur les ecrans etroits, pour ne pas se faire couper.
   « Stade français » est le pire cas, quatorze signes. */
.cote b.nom{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:420px){.cote b.nom{font-size:11.5px}}
.score{display:flex;gap:3px;flex:0 0 auto}
.score i{font:800 16px/1 "Barlow Condensed",sans-serif;font-style:normal;
  background:var(--panel);color:var(--panel-ink);
  min-width:25px;text-align:center;padding:5px 3px;border-radius:5px}
/* Largeur fixe, meme vide : le resultat ne doit rien bouger en apparaissant. */
.fin .nb{flex:0 0 34px;font:600 12px Barlow,sans-serif;color:var(--ok);
  white-space:nowrap;text-align:right}
/* Sur un ecran etroit, les sigles longs — USAP, MHR — debordaient de leur
   moitie et passaient par-dessus l'annee. On resserre tout d'un cran plutot
   que de tronquer un sigle, qui est deja une abreviation. */
@media (max-width:365px){
  .fin{gap:5px}
  .fin .an{flex-basis:30px;font-size:16px}
  .duel{gap:4px}
  .cote{gap:4px}
  .cote b{font-size:13px}
  .cote b.sig{flex-basis:32px}
  .cote b.nom{font-size:11px}
  .rond{width:17px;height:17px;flex-basis:17px}
  .score i{min-width:21px;font-size:14px;padding:4px 2px}
  .fin .nb{flex-basis:26px;font-size:10.5px}
}
.fin:hover .cote b{color:var(--pitch)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

<div class="wrap">
<section id="home">
  <div class="brand"><h1>Compo<span class="dot">.</span>io</h1>
    <button class="portrait" id="versmoi" data-va="moi" aria-label="Mon profil"></button></div>
  <!-- Les onglets suivent la marque immediatement, ici comme dans l'autre
       section : toute ligne intercalee d'un seul cote les faisait sauter de
       cinquante pixels au changement d'onglet. -->
  <nav class="onglets"><button class="on" data-va="home">Aujourd’hui</button>
    <button data-va="archives">Toutes les finales</button></nav>
  <p class="lede">Sauras-tu refaire les compos des grandes finales ?</p>
  <div id="daily"></div>
</section>
<section id="archives" class="hidden">
  <div class="brand"><h1>Compo<span class="dot">.</span>io</h1>
    <button class="portrait" id="versmoi2" data-va="moi" aria-label="Mon profil"></button></div>
  <nav class="onglets"><button data-va="home">Aujourd’hui</button>
    <button class="on" data-va="archives">Toutes les finales</button></nav>
  <p class="lede">Hors classement : seule la compo du jour compte.</p>
  <div id="arch"></div>
</section>
<section id="moi" class="hidden">
  <div class="top"><button class="back" data-va="home">Retour</button></div>
  <h2 class="title">Moi</h2>
  <!-- Tableau de bord : vide pour tout le monde, rempli seulement si le
       serveur reconnait le code de reprise comme celui du proprietaire. -->
  <div id="admin"></div>
  <div id="profil"></div>
  <!-- La date de mise en ligne, posee par tools/site.sh. Elle dit d'un coup
       d'oeil si l'app ouverte est bien la derniere, cache compris. -->
  <p class="sub" style="margin-top:26px;font-size:12.5px">Version du __VERSION__</p>
</section>
<section id="play" class="hidden">
  <!-- Seule cette partie peut glisser pendant une partie. La saisie et les
       boutons restent dessous, toujours visibles : le navigateur n'a donc
       jamais besoin de faire defiler quoi que ce soit pour amener le clavier
       en vue, et le titre ne part plus en haut. -->
  <div class="scene" id="scene">
    <h2 class="title" id="ptitle"></h2>
    <p class="sub" id="psub"></p>
    <div class="pitch" id="pitch"></div>
  </div>
  <!-- Chrono et compteur encadrent l'entraineur : tout ce qui bouge pendant la
       partie est reuni sous le terrain, juste au-dessus de la saisie. -->
  <div class="barre">
    <div class="clock" id="clock">3:00</div>
    <div class="bench hidden" id="bench"></div>
    <div class="count" id="count">0/11</div>
  </div>
  <!-- La saisie est sous le terrain : clavier ouvert, on voit encore les
       postes, au lieu de les avoir derrière le clavier. Et elle est le dernier
       element, pour venir se coller au clavier : la ligne de retour passe
       au-dessus d'elle. -->
  <p class="flash" id="flash" aria-live="polite"></p>
  <!-- Les suggestions prennent la place de la ligne de retour : jamais les deux
       en meme temps, donc la hauteur ne bouge pas. -->
  <div class="sugg" id="sugg" hidden></div>
  <input class="inp" id="inp" enterkeyhint="go" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Tape un joueur…" aria-label="Nom d’un joueur">
  <div class="actions" id="acts"><button class="btn" id="hint">Indice</button><button class="btn" id="giveup">Abandonner</button></div>
  <div class="result hidden" id="result">
    <div class="big" id="rbig"></div>
    <p id="rtxt" style="margin:6px 0 10px;color:var(--muted)"></p>
    <p id="rmiss" style="margin:0 0 12px;font-size:14.5px"></p>
    <div id="board"></div>
    <div class="actions" style="margin:0"><button class="btn primary" id="share" hidden>Partager</button><button class="btn" id="other">Retour</button></div>
    <p class="apres"><a href="#" id="again">Rejouer cette compo</a><a href="#" id="swap">Jouer l’autre équipe</a></p>
  </div>
  <!-- Retour et sport en bas : l'ecran s'ouvre directement sur l'affiche du
       match, et le haut n'est pas mange par une barre de navigation. -->
  <div class="top bas"><button class="back" id="back">Retour</button><span class="sport" id="psport"></span></div>
</section>
</div>

  const d=[...Array(b.length+1).keys()];
  for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;let mini=d[0];

// Clé « à l'oreille ». On écrase les différences d'orthographe qui ne
// s'entendent pas, pour que Schweinsteiger passe écrit Chvainstaiguer. Toutes
// les règles sont vérifiées contre les 234 compos : aucune ne doit rapprocher
// deux joueurs d'une même équipe (voir tools/test_noms.js).
function sonne(x){
  return x
    .replace(/ph/g,"f")
    .replace(/sch/g,"ch").replace(/ch/g,"C")      // C tient lieu du son « ch »
    .replace(/qu|q/g,"k").replace(/ck/g,"k")
    .replace(/c(?=[eiy])/g,"s").replace(/c/g,"k")
    .replace(/g(?=[eiy])/g,"j").replace(/gu(?=[eiy])/g,"g")
    .replace(/h/g,"")
    .replace(/eau|au/g,"o").replace(/ou/g,"u").replace(/ai|ei|ay|ey/g,"e")
    .replace(/y/g,"i").replace(/w/g,"v").replace(/z/g,"s").replace(/x/g,"ks")
    .replace(/(.)\1+/g,"$1")                      // lettres doublées
    .replace(/([a-z])[stdpg]\b/g,"$1")            // consonne finale muette
    .replace(/\s+/g," ").trim();
}

// Rend les clés d'un nom : l'écriture exacte, et sa version à l'oreille.
function cles(name,al){
  const k=new Set();
  [name,...(al||[])].forEach(src=>{const x=norm(src);if(!x)return;k.add(x);
    const w=x.split(" ");
    // Toutes les fins de nom, pas seulement la derniere : on ne sait pas ou
    // s'arrete le prenom. "Pieter-Steph du Toit" donne « steph du toit »,
    // « du toit » et « toit ». Avant, le trait d'union comptait pour deux mots,
    // donc la seule coupe essayee etait « steph du toit » : « du toit » n'etait
    // une cle de personne.
    for(let i=1;i<w.length;i++)k.add(w.slice(i).join(" "));
    if(w.length>1)k.add([...w].sort().join(" "));  // « barthez fabien » aussi
  });
  [...k].forEach(x=>k.add(x.replace(/ /g,"")));
  ["de","du","le","van","der","di","mac","la","da","dos"].forEach(x=>k.delete(x));
  const s=new Set();[...k].forEach(x=>{const y=sonne(x.replace(/ /g,""));if(y.length>2)s.add(y)});
  return {k,s};
}

// Le score, tel qu'il est ecrit dans l'affiche. Le premier couple de chiffres
// est le score du match ; ce qui suit entre parentheses — « (4–2 t.a.b.) » —
// est la maniere dont il s'est decide, et se dit a part.
function duel(m){
  const [a,b]=m.teams.map(t=>t.name);
  const sc=m.fx.match(/(\d+)\s*[–-]\s*(\d+)/);
  // Les deux camps se serrent contre le score : le cote gauche pousse a droite,
  // le droit a gauche. Sans ca ils partaient aux deux bords et le regard devait
  // traverser toute la ligne.
  return `<span class="duel">`
    +`<span class="cote">${camp(a,m.sport,false)}</span>`
    +`<span class="score"><i>${sc?sc[1]:"–"}</i><i>${sc?sc[2]:"–"}</i></span>`
    +`<span class="cote droite">${camp(b,m.sport,true)}</span></span>`;
}

// la meme colonne d'une ligne a l'autre.
function camp(nom,sport,droite){
  const e=EQUIPES[nom];
  if(e&&e.g)return droite?`<b class="sig">${esc(sigle(nom))}</b>${marque(nom)}`
                         :`${marque(nom)}<b class="sig">${esc(sigle(nom))}</b>`;

// Trois filets, du plus sûr au plus large. Les deux premiers tournent a chaque
// frappe ; le troisieme, qui pardonne les fautes, attend la touche Entree pour
// ne pas valider un nom a moitie tape.
function cherche(q,loose,deja){
  const n=norm(q);if(n.length<2)return -1;
  const c=n.replace(/ /g,""),so=sonne(c),tol=pardon(c.length);
  const vise=(i)=>deja?found.has(i):!found.has(i);
  let idx=P.findIndex((p,i)=>vise(i)&&(p.k.has(n)||p.k.has(c)));          // ecrit juste
  if(idx<0&&so.length>2)idx=P.findIndex((p,i)=>vise(i)&&p.s.has(so));     // sonne pareil
  if(idx<0&&loose&&tol>0){                                                // a quelques fautes pres
    let mieux=99;
    P.forEach((p,i)=>{if(!vise(i))return;
      [...p.k].forEach(k=>{const kk=k.replace(/ /g,"");
        if(kk.length<5)return;const d=lev(c,kk,tol);if(d<mieux){mieux=d;idx=i}});
      [...p.s].forEach(k=>{const d=lev(so,k,Math.max(1,tol-1));if(d<mieux){mieux=d;idx=i}});
    });

// Tous les noms de la base, toutes finales confondues, et JAMAIS la compo du
// jour : une suggestion ne dit donc pas que le joueur est sur le terrain. Un
// joueur qui sait qui il cherche mais pas comment ca s'ecrit s'en sort ; celui
// qui ne sait pas reste devant la meme page blanche.
let TOUS=null;
function tousLesNoms(){
  if(TOUS)return TOUS;
  const vus=new Map();
  MATCHES.forEach(x=>x.teams.forEach(t=>{
    t.p.forEach(p=>vus.set(p[3],1));
    if(t.coach)vus.set(t.coach[0],1);
  }));
  // Un seul representant par nom de famille : « Martínez » deux fois de suite
  // n'aide personne.
  const parNom=new Map();
  [...vus.keys()].forEach(n=>{const f=nomCourt(n);if(!parNom.has(f))parNom.set(f,n)});
  // sf : la cle « a l'oreille », calculee une fois pour toutes. C'est elle qui
  // rattrape celui qui ne sait pas ecrire le nom qu'il a en tete.
  TOUS=[...parNom].map(([f,n])=>{const cf=norm(f).replace(/ /g,"");
    return {n,f,cf,sf:sonne(cf)}});
  TOUS.sort((a,b)=>a.cf<b.cf?-1:a.cf>b.cf?1:0);
  return TOUS;
}
function suggere(q){
  const c=norm(q).replace(/ /g,"");
  // Quatre lettres : a trois, la liste sortait a la moindre amorce et donnait
  // trop facilement des noms qu'on n'avait pas vraiment en tete.
  if(c.length<4)return [];
  const debut=[],dedans=[];
  for(const p of tousLesNoms()){
    // Le nom de famille, et lui seul. Chercher aussi dans le prenom donnait des
    // resultats qui semblaient sortis de nulle part : « cle » proposait
    // Poitrenaud, parce qu'il s'appelle Clement — et la pastille, elle,
    // n'affiche que « Poitrenaud ».
    if(p.cf.startsWith(c)){if(debut.length<6)debut.push(p)}
    else if(dedans.length<6&&p.cf.includes(c))dedans.push(p);
    if(debut.length>=6)break;
  }
  // En dernier recours seulement, l'oreille : « dech » ne commence aucun nom,
  // mais sonne comme Deschamps. De meme « sidan » pour Zidane, « cante » pour
  // Kanté. En dernier recours, parce que la cle phonetique est courte et
  // ratisserait large si on la passait avant.
  if(!debut.length&&!dedans.length){
    const so=sonne(c);
    if(so.length>2)for(const p of tousLesNoms()){
      if(p.sf.startsWith(so)){dedans.push(p);if(dedans.length>=6)break}
    }
  }
  return [...debut,...dedans].slice(0,6);
}

  if(loose&&cherche(q,true,true)>=0){$("flash").textContent="Déjà trouvé.";$("inp").value="";return true}
  return false;
}
// Taper le terrain referme le clavier : sans ca, quand la place manque, plus
// rien ne permet de sortir de la saisie.
// Une TAPE, pas un glissement : sur pointerdown seul, le simple fait de poser
// le doigt pour faire defiler le panneau fermait le clavier.
let tapeX=0,tapeY=0,tapeVa=false;
$("play").addEventListener("pointerdown",e=>{
  tapeVa=$("play").classList.contains("enjeu")&&!e.target.closest("input,button,a");
  tapeX=e.clientX;tapeY=e.clientY;
});
$("play").addEventListener("pointerup",e=>{
  if(!tapeVa)return;
  tapeVa=false;
  if(Math.abs(e.clientX-tapeX)>12||Math.abs(e.clientY-tapeY)>12)return;  // c'etait un glissement
  $("inp").blur();
});
$("play").addEventListener("pointercancel",()=>{tapeVa=false});
$("inp").addEventListener("input",e=>{if(!over)tryMatch(e.target.value,false);montreSugg(e.target.value)});
$("inp").addEventListener("keydown",e=>{if(e.key!=="Enter"||over)return;
  if(!tryMatch(e.target.value,true)&&e.target.value.trim()){const el=$("inp");el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake");$("flash").textContent="Pas dans cette compo.";}
  montreSugg($("inp").value);});
$("hint").onclick=()=>{if(over)return;const todo=P.map((_,i)=>i).filter(i=>!found.has(i)&&!hinted.has(i));if(!todo.length)return;
  const i=todo[Math.floor(Math.random()*todo.length)];hinted.add(i);const last=nomCourt(P[i].n);
  $("pl"+i).querySelector(".nm").textContent=last[0]+"…";$("flash").textContent=`Indice : un nom en ${last[0].toUpperCase()}.`;$("inp").focus();};
$("giveup").onclick=()=>end();
// L'affiche du match pour le partage : FRANCE - BRESIL 98. Pas de score, il
// n'apporte rien a quelqu'un qu'on invite a jouer.
const affiche=m=>m.teams.map(t=>nomCourtEquipe(t.name,m.sport)).join(" - ").toUpperCase()+" "+String(m.yr).slice(-2);
// Le meme defi, qu'on parte de la carte du jour ou de la fin d'une partie.
const texteDefi=m=>affiche(m)+"\nPeux-tu refaire la compo ?\n"+location.origin+location.pathname;
// Copie dans le presse-papier, et le dit sur le bouton lui-meme.
async function copier(txt,b,libelle){
  try{await navigator.clipboard.writeText(txt);b.textContent="Copié !";
    setTimeout(()=>{b.textContent=libelle},1800);}
  catch(e){prompt("Copie ce texte :",txt)}
}
function end(){
  if(over)return;over=true;clearInterval(tick);$("inp").disabled=true;$("inp").hidden=true;
  $("play").classList.remove("enjeu");document.body.classList.remove("enjeu");  // le bilan a le droit de defiler
  P.forEach((p,i)=>{if(!found.has(i)){const d=$("pl"+i);d.className=(p.coach?"coach":"pl")+" miss";d.querySelector(".nm").textContent=p.coach?p.n:nomCourt(p.n);}});
  const t=Math.round((Date.now()-startT)/1000),tot=P.length,key=bestKey(M,TI),b=store.get(key);
  const better=found.size>0&&(!b||found.size>b.f||(found.size===b.f&&t<b.t));if(better)store.set(key,{f:found.size,t});
  const miss=tot-found.size,coachOut=P.some((p,i)=>p.coach&&!found.has(i));
  $("rbig").textContent=found.size+"/"+tot;
  const nj=miss-(coachOut?1:0),bits=[];
  if(nj)bits.push(`${nj} joueur${nj>1?"s":""}`);
  if(coachOut)bits.push("l’entraîneur");
  // Le terrain ne porte que les noms de famille : la liste de fin rend les
  // prenoms, qui sont souvent la moitie du plaisir.
  const oublies=P.filter((_,i)=>!found.has(i)).map(p=>p.n);
  $("rmiss").textContent=oublies.length?"Il manquait : "+oublies.join(", ")+".":"";
  $("rtxt").textContent=(miss?`${bits.join(" et ")} manquant${miss>1?"s":""}, en rouge.`:`Compo complète en ${fmt(t)}.`)
    +(hinted.size?` ${hinted.size} indice${hinted.size>1?"s":""} utilisé${hinted.size>1?"s":""}.`:"")+(better&&b?" Nouveau record.":(!better&&b?` Record : ${b.f}/${tot}.`:""))+NOTE_FIN;
  if(RANKED&&!store.get(dailyKey(DAYN,M.sport))){
    const reste=Math.max(left,0),duree=TIME[M.sport];
    // Bonus proportionnel au temps accordé : foot et rugby plafonnent au même score.
    const bonus=found.size===tot?Math.round(BONUS_MAX*reste/duree):0;
    const pts=Math.max(0,Math.round(1000*found.size/tot)+bonus-50*hinted.size);
    store.set(dailyKey(DAYN,M.sport),{d:DAYN,f:found.size,n:tot,h:hinted.size,l:reste,p:pts,t});
    $("rbig").textContent=pts.toLocaleString("fr-FR")+" pts";
    $("rtxt").textContent=`${found.size}/${tot} trouvés en ${fmt(t)}.`
      +(found.size===tot?` Bonus de ${bonus} points pour ${reste} secondes restantes.`:"")
      +(hinted.size?` ${50*hinted.size} points retirés pour ${hinted.size} indice${hinted.size>1?"s":""}.`:"");
    $("share").hidden=false;
    majClassement(found.size,hinted.size);
    $("share").onclick=async()=>{
      copier(texteDefi(M),$("share"),"Partager");
      compte("/partage","Partage");
    };
  } else {$("share").hidden=true;$("board").innerHTML="";}
  $("acts").classList.add("hidden");$("result").classList.remove("hidden");$("flash").textContent="";montreSugg("");
  // Combien vont au bout : c'est le chiffre qui dit si le jeu est trop dur.
  compte(`/fini/${M.sport}/${found.size===P.length?"complet":"partiel"}`,"Fin de partie");
  // Le terrain est haut : sans ca le panneau de fin reste sous l'ecran et on
  // a l'impression qu'il ne s'est rien passe.
  setTimeout(()=>$("result").scrollIntoView({behavior:"smooth",block:"end"}),60);
}
// on rejoue : la raison de ne pas etre classe, elle, ne change pas
$("again").onclick=e=>{e.preventDefault();start(M,TI,false,NOTE_FIN)};
$("swap").onclick=e=>{e.preventDefault();start(M,1-TI,false,NOTE_FIN)};
// ---- toutes les finales ------------------------------------------------
// Rangees par sport puis par competition, et non par jour : on vient y chercher
// un match precis, pas « ce qui est tombe le 12 ». Hors classement, parce que
// le serveur n'accepte qu'une partie classee par jour et par sport, celle du
// jour meme.
// Trois competitions par sport : le code, le nom entier, et le nom du bouton.
const COMPETS={
  foot:[["cdm","Coupe du monde","CDM"],["euro","Euro","Euro"],["ldc","Ligue des champions","LDC"]],
  rugby:[["rwc","Coupe du monde","CDM"],["hcup","Coupe d’Europe","H Cup"],["top14","Top 14","Top 14"]],
};
let SPORT_ARCH="foot",COMP_ARCH="cdm";
function renderArchives(){
  const el=$("arch"),cps=COMPETS[SPORT_ARCH];
  // Au changement de sport, la competition choisie n'existe plus : on repart
  // de la premiere.
  if(!cps.some(([cp])=>cp===COMP_ARCH))COMP_ARCH=cps[0][0];
  const nom=(cps.find(([cp])=>cp===COMP_ARCH)||[])[1]||"";
  const liste=MATCHES.filter(m=>m.comp===COMP_ARCH).sort((a,b)=>b.yr-a.yr);
  el.innerHTML=`<div class="sports">`
    +SPORTS.map(sp=>`<button data-sa="${sp}"${sp===SPORT_ARCH?' class="on"':""}>${nomSport(sp)}</button>`).join("")
    +`</div>`
    // Deuxieme rangee, meme principe : une competition a la fois, plutot que
    // trois sections repliees dont deux restaient fermees.
    +`<div class="comps">`
    +cps.map(([cp,,court])=>`<button data-ca="${cp}"${cp===COMP_ARCH?' class="on"':""}>${court}</button>`).join("")
    +`</div>`
    +`<p class="combien">${nom} · ${liste.length} finales</p>`
    +`<div class="comp"><div class="dedans">`
        +liste.map(m=>{
          // Le meilleur resultat deja obtenu sur cette compo, s'il existe :
          // bestKey est deja rempli a chaque fin de partie, classee ou non.
          const t=m.teams[0],tot=t.p.length+(t.coach?1:0),f=store.get(bestKey(m,0));
          // Les deux colonnes de bord sont de largeur fixe et toujours la,
          // meme vides : le resultat qui apparait apres une partie decalait
          // toute la ligne, et on le voyait aussitot a cote des autres.
          const sup=supDe(m);
          return `<button class="fin${f?" fait":""}" data-id="${m.id}">`
            +`<span class="an">${m.yr}${sup?`<em>${esc(sup)}</em>`:""}</span>`
            +duel(m)
            +`<span class="nb">${f?f.f+"/"+tot:""}</span></button>`;
        }).join("")
    +`</div></div>`;
  el.querySelectorAll("[data-sa]").forEach(b=>b.onclick=()=>{SPORT_ARCH=b.dataset.sa;renderArchives()});
  el.querySelectorAll("[data-ca]").forEach(b=>b.onclick=()=>{COMP_ARCH=b.dataset.ca;renderArchives()});
  el.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{
    const m=MATCHES.find(x=>x.id===b.dataset.id);
    if(m)start(m,0,false," Hors classement : seule la compo du jour compte.");
  });
}

// ---- navigation entre les sections ------------------------------------
// Ce qui reste visible sous le clavier. L'API visualViewport est la seule a le
// savoir sur iOS, ou le clavier recouvre la page sans la retrecir.
function hauteurVisible(){
  const v=window.visualViewport;
  const px=v?v.height:innerHeight,haut=v?v.offsetTop:0;
  const st=document.documentElement.style;
  st.setProperty("--vue",px+"px");
  st.setProperty("--haut",haut+"px");
  $("play").classList.toggle("court",px<620);
  // Le signal, c'est le curseur dans le champ, pas une mesure du clavier.
  // Deviner le clavier a la hauteur a echoue deux fois : il recouvre la page
  // dans Safari mais retrecit la fenetre dans l'app installee, et selon le cas
  // la mesure ne voyait rien. « Le champ a le curseur » est vrai partout, ne
  // demande aucune mesure, et c'est exactement le moment ou l'on tape.
  // saisieActive, et pas seulement le focus : la partie s'ouvre avec le curseur
  // deja dans le champ, sans clavier. Sans ce garde-fou, Indice et Abandonner
  // disparaitraient avant meme qu'on ait touche a quoi que ce soit.
  const tape=saisieActive&&document.activeElement===$("inp");
  $("play").classList.toggle("clavier",tape);
  if(tape&&!direClavier&&!over&&!$("flash").textContent){
    direClavier=true;$("flash").textContent="Touche le terrain pour refermer le clavier.";
  }
  recale();
}
let direClavier=false;   // le rappel ne se dit qu'une fois par partie
// On est en saisie des qu'on touche le champ ou qu'on y ecrit, et plus des
// qu'on le quitte. Le focus seul ne suffit pas : il est pose au demarrage.
let saisieActive=false;
const entreEnSaisie=()=>{saisieActive=true;hauteurVisible()};
$("inp").addEventListener("pointerdown",entreEnSaisie);
$("inp").addEventListener("input",entreEnSaisie);
// Et au focus : pointerdown arrive AVANT que le champ prenne le curseur, donc
// le calcul fait sur lui seul concluait « pas en saisie ». C'est ce qui faisait
// que les boutons restaient a partir du deuxieme clic dans le champ.
$("inp").addEventListener("focus",hauteurVisible);
$("inp").addEventListener("blur",()=>{saisieActive=false;hauteurVisible()});
// Safari defile la page pour amener la saisie au-dessus du clavier, et il le
// fait APRES notre code, pendant l'animation du clavier. Une seule remise a
// zero ne suffit donc pas : on insiste une seconde. Des que --vue est a jour,
// la saisie est de toute facon au-dessus du clavier, ce defilement n'a plus
// aucune raison d'etre.
let recalage=null;
function recale(){
  clearInterval(recalage);
  let n=0;
  recalage=setInterval(()=>{
    if(!document.body.classList.contains("enjeu")||++n>20){clearInterval(recalage);return}
    if(window.scrollY||document.documentElement.scrollTop||document.body.scrollTop){
      window.scrollTo(0,0);
      document.documentElement.scrollTop=0;document.body.scrollTop=0;
    }
  },50);
}
if(window.visualViewport){
  visualViewport.addEventListener("resize",hauteurVisible);
  visualViewport.addEventListener("scroll",hauteurVisible);
}
addEventListener("resize",hauteurVisible);
hauteurVisible();

const SECTIONS=["home","archives","moi","play"];
let ONGLET="home";                       // l'onglet ou l'on revient apres une partie
// ---- mesure d'audience -------------------------------------------------
// GoatCounter : gratuit pour un usage non commercial, sans cookie — donc pas
// de bandeau a afficher — et il ne conserve aucune adresse IP.
// Tant que le code ci-dessous est vide, RIEN n'est charge et rien n'est envoye.
// C'est ce qui garde les tests hors ligne. Pour activer : remplacer "" par le
// code du compte, par exemple "compoio".
const GOATCOUNTER="";
if(GOATCOUNTER){
  const s=document.createElement("script");
  s.async=true;s.src="//gc.zgo.at/count.js";
  s.dataset.goatcounter=`https://${GOATCOUNTER}.goatcounter.com/count`;
  document.head.appendChild(s);
}
// L'app ne recharge jamais la page : sans ces appels on ne verrait qu'une seule
// vue par visiteur, et rien de ce qu'il fait. Les chemins sont choisis courts
// et en nombre fini, et ne portent jamais le pseudo ni quoi que ce soit qui
// vienne du joueur.
// Pas de garde sur GOATCOUNTER ici : sans code le script n'est jamais charge,
// donc window.goatcounter n'existe pas et l'appel ne fait rien. Ce qui rend du
// meme coup la mesure verifiable, en posant un faux compteur.
function compte(chemin,titre){
  const g=window.goatcounter;
  if(g&&g.count)g.count({path:chemin,title:titre||chemin,event:false});
}
function montre(nom){
  if(nom!=="play")ONGLET=nom;
  SECTIONS.forEach(s=>$(s).classList.toggle("hidden",s!==nom));
  window.scrollTo(0,0);
  if(nom==="home"){renderDaily();renderPortrait();}
  if(nom==="archives"){renderArchives();compte("/finales","Toutes les finales");}
  if(nom==="moi"){renderMoi();renderAdmin();compte("/profil","Profil");}
}
const home=()=>{clearInterval(tick);over=true;montre(ONGLET==="play"?"home":ONGLET);};
$("other").onclick=home;$("back").onclick=home;
document.querySelectorAll("[data-va]").forEach(b=>b.onclick=()=>montre(b.dataset.va));
// ---- tableau de bord du proprietaire -----------------------------------
// Il s'ouvre tout seul en haut du profil, et uniquement pour lui : le serveur
// compare le code de reprise a un secret qu'il est seul a connaitre. Pour tous
// les autres — et tant que le serveur n'est pas a jour — la reponse est un
// refus, et le bloc reste vide. Rien a cacher dans le navigateur, donc rien a
// contourner.
const nb=n=>(n||0).toLocaleString("fr-FR");
async function renderAdmin(){
  const el=$("admin");el.innerHTML="";
  let s;try{s=await api("stats",{playerId:moi().id})}catch(e){return}
  if(!s||!s.jours)return;                       // refus, ou serveur d'avant
  const taux=x=>x.n?Math.round(100*x.complets/x.n)+" %":"—";
  const moy=(t,n)=>n?Math.round(t/n):0;
  const hier=s.jours.slice(0,14);
  const pic=Math.max(1,...hier.map(j=>j.foot+j.rugby));
  el.innerHTML=
    `<div class="bloc"><h3>Tableau de bord</h3>
       <div class="chiffres">
         <span class="chiffre"><b>${nb(s.joueurs)}</b><span>joueurs inscrits</span></span>
         <span class="chiffre"><b>${nb(s.parties)}</b><span>parties jouées</span></span>
         <span class="chiffre"><b>${nb(s.fideles)}</b><span>revenus 3 jours ou +</span></span>
       </div></div>`
   +SPORTS.map(sp=>{const x=s.sports[sp]||{n:0};
      return `<div class="bloc"><h3>${nomSport(sp)} · 30 derniers jours</h3><div class="chiffres">`
        +`<span class="chiffre"><b>${nb(x.n)}</b><span>parties</span></span>`
        +`<span class="chiffre"><b>${taux(x)}</b><span>compos finies</span></span>`
        +`<span class="chiffre"><b>${x.total?Math.round(100*x.trouves/x.total):0} %</b><span>de noms trouvés</span></span>`
        +`<span class="chiffre"><b>${moy(x.secondes,x.n)} s</b><span>par partie</span></span>`
        +`<span class="chiffre"><b>${(moy(x.indices*10,x.n)/10).toString().replace(".",",")}</b><span>indices par partie</span></span>`
        +`</div></div>`}).join("")
   +`<div class="bloc"><h3>Les 14 derniers jours</h3>
       <table class="board" style="table-layout:fixed">
       <thead><tr><th style="width:14%">Jour</th><th style="width:22%">Joueurs</th>
       <th style="width:17%">Foot</th><th style="width:17%">Rugby</th><th style="width:30%"></th></tr></thead><tbody>`
   +(hier.length?hier.map(j=>`<tr><td>${j.day}</td><td class="n">${nb(j.joueurs)}</td>`
        +`<td class="n">${nb(j.foot)}</td><td class="n">${nb(j.rugby)}</td>`
        +`<td><span style="display:block;height:8px;border-radius:4px;background:var(--pitch);`
        +`width:${Math.round(100*(j.foot+j.rugby)/pic)}%"></span></td></tr>`).join("")
      :`<tr><td colspan="5">Personne n’a encore joué.</td></tr>`)
   +`</tbody></table></div>`;
}
// Le portrait porte l'initiale du pseudo, ou un trait tant qu'il n'y en a pas.
function renderPortrait(){
  const n=(moi().pseudo||"").trim(),l=n?n[0].toUpperCase():"·";
  // Les deux en-tetes portent le meme portrait : accueil et liste des finales.
  document.querySelectorAll(".portrait").forEach(b=>b.textContent=l);
}

// ---- profil : pseudo, code de reprise, chiffres ------------------------
// Le code de reprise EST l'identifiant du joueur. Le classement est tenu par
// cet identifiant, donc le recopier sur un autre telephone y ramene le profil
// et la serie. Il n'y a ni compte ni mot de passe : c'est le prix du zero
// inscription, et il faut le dire clairement a l'ecran.
const estUnCode=s=>/^[0-9a-f]{8}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{12}$/i.test(String(s).trim());
const rangeCode=s=>{const x=String(s).trim().toLowerCase().replace(/-/g,"");
  return [x.slice(0,8),x.slice(8,12),x.slice(12,16),x.slice(16,20),x.slice(20)].join("-")};

function chiffres(){
  const out={};SPORTS.forEach(s=>out[s]={joues:0,trouves:0,total:0,parfaites:0,meilleur:0});
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i),m=/^compo:jour:(foot|rugby):(\d+)$/.exec(k||"");
    if(!m)continue;const v=store.get(k);if(!v||!v.n)continue;
    const s=out[m[1]];s.joues++;s.trouves+=v.f||0;s.total+=v.n||0;
    if(v.p>s.meilleur)s.meilleur=v.p||0;
    if(v.f===v.n)s.parfaites++;
  }
  SPORTS.forEach(s=>out[s].serie=Math.max(streakOf(DAYN,s),streakOf(DAYN-1,s)));
  return out;
}

function renderMoi(){
  const je=moi(),c=chiffres();
  $("profil").innerHTML=
    `<div class="bloc"><h3>Pseudo</h3>
       <div class="ligne"><input id="mpseudo" maxlength="20" value="${esc(je.pseudo||"")}" placeholder="Ton pseudo">
       <button class="btn primary" id="mvalide">Enregistrer</button></div></div>`
   +`<div class="bloc"><h3>Code de reprise</h3>
       <p>Garde ce code : c’est la seule façon de retrouver ton profil et ta série sur un autre téléphone. Il n’y a ni compte ni mot de passe.</p>
       <div class="code" id="moncode">${esc(je.id)}</div>
       <div class="ligne"><button class="btn" id="mcopier">Copier le code</button></div></div>`
   +`<div class="bloc"><h3>Reprendre un profil</h3>
       <p>Colle ici le code d’un profil existant. Il remplacera celui de ce téléphone.</p>
       <div class="ligne"><input id="mcode" placeholder="Colle le code ici" autocomplete="off" spellcheck="false">
       <button class="btn" id="mreprendre">Reprendre</button></div>
       <p id="mdit" style="margin:10px 0 0;color:var(--muted)"></p></div>`
   +SPORTS.map(sp=>{const s=c[sp];
      return `<div class="bloc"><h3>${nomSport(sp)}</h3><div class="chiffres">`
        +`<span class="chiffre"><b>${s.joues}</b><span>compos jouées</span></span>`
        +`<span class="chiffre"><b>${s.parfaites}</b><span>sans faute</span></span>`
        +`<span class="chiffre"><b>${s.total?Math.round(100*s.trouves/s.total):0}%</b><span>de réussite</span></span>`
        +`<span class="chiffre"><b>${s.meilleur.toLocaleString("fr-FR")}</b><span>meilleur score</span></span>`
        +`<span class="chiffre"><b>${s.serie}</b><span>jours de suite</span></span>`
        +`</div></div>`}).join("");

  $("mvalide").onclick=()=>{const v=$("mpseudo").value.trim();
    if(v.length<2){$("mpseudo").focus();return}
    majMoi({pseudo:v.slice(0,20)});$("mvalide").textContent="Enregistré";
    setTimeout(()=>$("mvalide").textContent="Enregistrer",1500);};
  $("mcopier").onclick=async()=>{
    try{await navigator.clipboard.writeText(moi().id);$("mcopier").textContent="Copié !";
      setTimeout(()=>$("mcopier").textContent="Copier le code",1800);}
    catch(e){prompt("Ton code de reprise :",moi().id)}};
  $("mreprendre").onclick=()=>{
    const v=$("mcode").value.trim();
    if(!estUnCode(v)){$("mdit").textContent="Ce code n’a pas la bonne forme.";return}
    if(rangeCode(v)===moi().id){$("mdit").textContent="C’est déjà le profil de ce téléphone.";return}
    majMoi({id:rangeCode(v)});
    $("mdit").textContent="Profil repris. Le classement te reconnaîtra sous ce code.";
    renderMoi();renderDaily();};
}

montre("home");
