name: Publication du jeu sur GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication a la fois ; on laisse finir celle qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Le jeu tient dans un seul fichier : on ne met en ligne que celui-la,
      # pas le pipeline de donnees ni les migrations Supabase.
      - name: Preparer le dossier a publier
        run: |
          mkdir -p site
          cp index.html site/index.html
          cp index.html site/404.html

      # Ne pas remettre `enablement: true` ici : essaye, refuse. L'action appelle
      # alors l'API de creation du site Pages, qui demande le droit
      # d'administration sur le depot ; le jeton d'un workflow ne l'a jamais,
      # meme avec pages: write. Le run echoue sur "Create Pages site failed.
      # Error: Resource not accessible by integration".
      # Activer Pages reste une manipulation humaine, une seule fois :
      # Settings > Pages > Source: GitHub Actions.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4
