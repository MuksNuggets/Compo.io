<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compo.io</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EDE5; --surface:#F6F8F4; --ink:#13241A; --muted:#5A6B5E; --line:#C7D2C3;
  --pitch:#2E7D4F; --stripe:#33895A; --chalk:rgba(255,255,255,.82);
  --accent:#F2B705; --accent-ink:#1A1400; --miss:#C93C3C; --ok:#1F8A4C;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1712; --surface:#15221A; --ink:#E4ECE5; --muted:#8EA093; --line:#26392C;
    --pitch:#1D5A37; --stripe:#21633D; --chalk:rgba(255,255,255,.7);
    --accent:#F2B705; --accent-ink:#1A1400; --miss:#E06060; --ok:#3FBF74;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1712; --surface:#15221A; --ink:#E4ECE5; --muted:#8EA093; --line:#26392C;
  --pitch:#1D5A37; --stripe:#21633D; --chalk:rgba(255,255,255,.7);
  --accent:#F2B705; --accent-ink:#1A1400; --miss:#E06060; --ok:#3FBF74;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Barlow,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:600px;margin:0 auto;padding:20px 16px 48px}
.cond{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Home */
.brand{display:flex;align-items:baseline;gap:10px;margin:8px 0 4px}
.brand h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:clamp(56px,14vw,88px);line-height:.9;margin:0;letter-spacing:-.01em}
.brand .dot{color:var(--pitch)}
.lede{color:var(--muted);margin:6px 0 24px;max-width:46ch}
.filters{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:12px;background:var(--surface)}
.filters button{border:0;background:none;padding:6px 16px;border-radius:999px;font-weight:600;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.list{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.row{display:grid;grid-template-columns:56px 1fr;gap:6px 14px;align-items:start;border-bottom:1px solid var(--line);padding:14px 4px}
.picks{grid-column:2;display:flex;gap:8px;flex-wrap:wrap}
.pick{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 6px;font-weight:600;font-size:14px}
.pick:hover{border-color:var(--ink)}
.pick i{width:14px;height:14px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.pick b{font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--muted);font-size:15px}
.pick b.full{color:var(--ok)}
.src{color:var(--muted);font-size:13px;margin-top:28px}
.yr{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:28px;line-height:1.1}
.fx{font-weight:600;font-size:17px;line-height:1.25}
.fx small{display:block;font-weight:400;color:var(--muted);font-size:14px}
.best{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px;color:var(--muted);min-width:44px;text-align:right}
.best.full{color:var(--ok)}
.sport{font-size:13px;color:var(--muted)}

/* Play */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.back{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-weight:600}
.title{margin:6px 0 2px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:28px;line-height:1.1}
.sub{color:var(--muted);margin:0 0 14px;font-size:15px}
.board{display:flex;align-items:stretch;gap:8px;margin-bottom:10px}
.clock,.count{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:34px;line-height:1;padding:8px 14px;border-radius:8px;background:var(--ink);color:var(--accent);font-variant-numeric:tabular-nums}
.count{color:var(--bg)}
.clock.low{color:#FF6B6B}
.inp{flex:1;min-width:0;font:600 18px Barlow,sans-serif;padding:0 14px;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.inp:focus{outline:none;border-color:var(--accent)}
.inp.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.flash{min-height:22px;font-size:14px;color:var(--muted);margin:0 0 8px}
.pitch{position:relative;width:100%;border-radius:10px;overflow:hidden;
  background:repeating-linear-gradient(to bottom,var(--pitch) 0 8%,var(--stripe) 8% 16%)}
.pitch.foot{aspect-ratio:68/100}
.pitch.rugby{aspect-ratio:70/112}
.pitch svg.lines{position:absolute;inset:0;width:100%;height:100%}
.pl{position:absolute;transform:translate(-50%,-30%);display:flex;flex-direction:column;align-items:center;width:84px;pointer-events:none}
.pl svg{width:36px;height:34px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.pl .nm{margin-top:2px;font:600 12px/1.15 Barlow,sans-serif;text-align:center;color:#fff;background:rgba(0,0,0,.42);padding:2px 5px;border-radius:4px;min-width:28px;max-width:84px}
.pl.todo .nm{color:rgba(255,255,255,.6)}
.pl.hit .nm{background:#fff;color:#13241A;animation:pop .35s}
.pl.miss .nm{background:var(--miss);color:#fff}
.bench{display:flex;justify-content:center;margin-top:8px}
.coach{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:5px 12px 5px 7px}
.coach .badge{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 11px/1 Barlow,sans-serif;background:rgba(255,255,255,.9);color:#13241A}
.coach .role{font:600 10.5px/1 Barlow,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.coach .nm{font:600 13px/1.15 Barlow,sans-serif;color:#fff;padding:2px 6px;border-radius:4px}
.coach.todo .nm{color:rgba(255,255,255,.55)}
.coach.hit .nm{background:#fff;color:#13241A;animation:pop .35s}
.coach.miss .nm{background:var(--miss);color:#fff}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.result{margin-top:14px;padding:16px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.result .big{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:44px;line-height:1}
.hidden{display:none!important}
@media (max-width:420px){
  .pl{width:66px}.pl .nm{font-size:10.5px;max-width:66px}.pl svg{width:28px;height:27px}
  .clock,.count{font-size:28px;padding:8px 10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
<section id="home">
  <div class="brand"><h1>Compo<span class="dot">.</span>io</h1></div>
  <p class="lede">Retrouve les titulaires des finales qui ont marqué l’histoire. Choisis un match, puis l’équipe à deviner. Un nom de famille suffit.</p>
  <div class="filters" role="group" aria-label="Compétition" id="filters"></div>
  <ul class="list" id="list"></ul>
  <p class="src">Données : Fjelstul World Cup Database (CC BY-SA 4.0), StatsBomb Open Data, Wikipédia.</p>
</section>
<section id="play" class="hidden">
  <div class="top"><button class="back" id="back">Tous les matchs</button><span class="sport" id="psport"></span></div>
  <h2 class="title" id="ptitle"></h2>
  <p class="sub" id="psub"></p>
  <div class="board">
    <div class="clock" id="clock">3:00</div>
    <input class="inp" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Tape un joueur…" aria-label="Nom d’un joueur">
    <div class="count" id="count">0/11</div>
  </div>
  <p class="flash" id="flash" aria-live="polite"></p>
  <div class="pitch" id="pitch"></div>
  <div class="bench hidden" id="bench"></div>
  <div class="actions" id="acts"><button class="btn" id="hint">Indice</button><button class="btn" id="giveup">Abandonner</button></div>
  <div class="result hidden" id="result">
    <div class="big" id="rbig"></div>
    <p id="rtxt" style="margin:6px 0 12px;color:var(--muted)"></p>
    <div class="actions" style="margin:0"><button class="btn primary" id="again">Rejouer</button><button class="btn" id="swap">Jouer l’autre équipe</button><button class="btn" id="other">Autre match</button></div>
  </div>
</section>
</div>

  if(coachOut)bits.push("l’entraîneur");
  $("rtxt").textContent=(miss?`${bits.join(" et ")} manquant${miss>1?"s":""}, en rouge.`:`Compo complète en ${fmt(t)}.`)
    +(hinted.size?` ${hinted.size} indice${hinted.size>1?"s":""} utilisé${hinted.size>1?"s":""}.`:"")+(better&&b?" Nouveau record.":(!better&&b?` Record : ${b.f}/${tot}.`:""));
  $("acts").classList.add("hidden");$("result").classList.remove("hidden");$("flash").textContent="";
}
$("again").onclick=()=>start(M,TI);$("swap").onclick=()=>start(M,1-TI);
const home=()=>{clearInterval(tick);over=true;$("play").classList.add("hidden");$("home").classList.remove("hidden");renderHome();};
$("other").onclick=home;$("back").onclick=home;
renderHome();
</script>
